<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比手畫腳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B3B3C;
    --bg-2: #0F4E4F;
    --gold: #F4A300;
    --pink: #FF5D73;
    --mint: #6FCF97;
    --cream: #FFF6E9;
    --ink: #05201F;
    --line: rgba(255,246,233,0.16);
    --skip-red: #D74848;
    --skip-red-dk: #B33636;
    --ok-green: #2FA35A;
    --ok-green-dk: #24824A;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100vh;
    background: #061F20;
    color:var(--cream);
    font-family:'Noto Sans TC', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* 16:9 landscape frame, letterboxed to fit any viewport/orientation */
  #frame{
    position:relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background:
      radial-gradient(circle at 12% -10%, var(--bg-2) 0%, transparent 45%),
      radial-gradient(circle at 108% 112%, #0d4445 0%, transparent 50%),
      var(--bg);
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,246,233,.08);
  }
  .rotate-hint{
    position:absolute; top:8px; right:10px; z-index:50;
    font-size:10px; color:rgba(255,246,233,.45);
    display:none; align-items:center; gap:4px;
  }
  @media (orientation:portrait){ .rotate-hint{ display:flex; } }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .hidden{ display:none; }

  .btn{
    font-family:inherit; border:none; cursor:pointer;
    border-radius: 14px; font-weight:700; color:var(--ink);
    background:var(--cream);
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn-primary{ background:var(--gold); }
  .btn-ghost{ background:transparent; color:var(--cream); box-shadow:none; border:2px solid var(--line); }
  .btn-ghost:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn:disabled:active{ transform:none; box-shadow:4px 4px 0 var(--ink); }

  /* ---------- HOME (landscape) ---------- */
  #home{ padding: 16px 22px 14px; }
  .home-header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  h1.title{
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight:900; margin:0; letter-spacing:1px;
    transform: rotate(-1.5deg); flex-shrink:0;
  }
  .subtitle{ font-size:11.5px; color:rgba(255,246,233,.6); line-height:1.5; text-align:right; max-width:340px; }

  .cat-scroll{
    flex:1; display:flex; gap:10px; align-items:stretch;
    overflow-x:auto; overflow-y:hidden;
    padding: 14px 2px 10px;
    scroll-snap-type:x proximity;
  }
  .cat-scroll::-webkit-scrollbar{ height:5px; }
  .cat-scroll::-webkit-scrollbar-thumb{ background:rgba(255,246,233,.25); border-radius:3px; }

  .cat-card{
    scroll-snap-align:start;
    flex: 0 0 128px;
    border-radius: 18px;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 12px 12px 10px;
    display:flex; flex-direction:column; justify-content:space-between;
    cursor:pointer; color:var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .cat-card:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .cat-card.selected{ outline:3px solid var(--cream); outline-offset:2px; }
  .cat-card.mixcard{ flex-basis:150px; }
  .cat-name{ font-size:16px; font-weight:900; line-height:1.25; }
  .cat-sample{ font-size:10px; opacity:.7; line-height:1.4; margin-top:6px; }
  .cat-count{ font-size:10.5px; font-weight:700; opacity:.6; margin-top:8px; }

  .home-footer{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding-top:6px;
  }
  .timer-pills{ display:flex; gap:8px; }
  .pill{
    padding:7px 14px; border-radius:999px; font-weight:700; font-size:12.5px;
    border:2px solid var(--line); background:transparent; color:var(--cream); cursor:pointer;
  }
  .pill.active{ background:var(--cream); color:var(--ink); border-color:var(--cream); }
  #startBtn{ padding:12px 26px; font-size:14.5px; border-radius:14px; }
  .tilt-test{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; justify-content:center; }
  #testTiltBtn{ padding:7px 14px; font-size:12px; flex-shrink:0; }
  .tilt-status{ font-size:11px; color:rgba(255,246,233,.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- GAME ---------- */
  #game{ flex-direction:row; }
  .zone{
    flex:1; height:100%; position:relative;
    display:flex; align-items:flex-end; justify-content:center;
    cursor:pointer; overflow:hidden;
  }
  .zone-skip{ background: linear-gradient(155deg, var(--skip-red) 0%, var(--skip-red-dk) 100%); }
  .zone-correct{ background: linear-gradient(205deg, var(--ok-green) 0%, var(--ok-green-dk) 100%); }
  .zone-label{
    position:absolute; bottom:14px; font-size:13px; font-weight:900;
    display:flex; align-items:center; gap:6px; opacity:.85;
  }
  .zone-skip .zone-label{ left:16px; }
  .zone-correct .zone-label{ right:16px; }
  .zone-mark{ font-size:17px; }
  .zone-flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .zone-flash.show{ animation: zf .45s ease forwards; }
  @keyframes zf{ 0%{opacity:.55;} 100%{opacity:0;} }

  .center-divider{ position:absolute; top:0; bottom:0; left:50%; width:1px; background:rgba(255,246,233,.2); z-index:2; }

  .word-overlay{
    position:absolute; inset: 0 0 0 0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:5; padding: 0 8%;
  }
  .word-card{
    background:rgba(5,32,31,.55);
    backdrop-filter: blur(2px);
    border-radius:20px;
    padding: 18px 34px;
    text-align:center;
    max-width:78%;
  }
  .word{
    font-weight:900; line-height:1.15; color:var(--cream);
    text-shadow: 3px 3px 0 rgba(0,0,0,.28);
    word-break:break-word;
  }

  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 16px 0;
    pointer-events:none;
  }
  .score-box, .timer-box{
    font-weight:900; font-size:16px; color:var(--cream);
    background:rgba(5,32,31,.45); padding:4px 12px; border-radius:10px;
  }
  .score-box span{ font-size:9.5px; font-weight:500; opacity:.7; display:block; }
  .timer-track{
    position:absolute; top:0; left:0; right:0; height:4px; z-index:7;
    background:rgba(255,246,233,.15);
  }
  .timer-fill{ height:100%; background:var(--cream); width:100%; }

  .hint-pill{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-size:10px; color:rgba(255,246,233,.7);
    background:rgba(5,32,31,.5); padding:4px 10px; border-radius:999px;
    z-index:6; pointer-events:none; white-space:nowrap;
  }

  /* ---------- RESULTS ---------- */
  #results{ padding: 18px 26px; align-items:center; }
  .result-score{ text-align:center; }
  .result-score .big{ font-size:38px; font-weight:900; }
  .result-score .lbl{ font-size:11.5px; color:rgba(255,246,233,.6); }
  .result-list{
    width:100%; max-width:640px; flex:1; overflow-y:auto;
    border-top:2px solid var(--line); margin-top:8px;
    column-count:2; column-gap:20px;
  }
  .result-item{
    display:flex; align-items:center; gap:8px;
    padding: 6px 2px; border-bottom:1px solid var(--line);
    font-size:12.5px; break-inside: avoid;
  }
  .result-item .mark{ font-weight:900; font-size:12.5px; width:16px; text-align:center; flex-shrink:0; }
  .result-item.correct .mark{ color:var(--ok-green); }
  .result-item.skip .mark{ color:rgba(255,246,233,.4); }
  .result-item.skip{ color:rgba(255,246,233,.5); }
  .result-actions{ display:flex; gap:12px; width:100%; max-width:640px; margin: 10px 0 2px; }
  .result-actions .btn{ flex:1; padding:11px 0; font-size:13px; }

  ::-webkit-scrollbar{ width:5px; }
</style>
</head>
<body>
<div id="frame">
  <div class="rotate-hint">⟲ 建議橫向持機</div>

  <!-- ============ HOME ============ -->
  <div id="home" class="screen">
    <div class="home-header">
      <h1 class="title">比手畫腳</h1>
      <p class="subtitle">貼在額頭上讓朋友比給你猜。手機往上傾或點右半邊＝答對，往下傾或點左半邊＝跳過。</p>
    </div>

    <div class="cat-scroll" id="catScroll"></div>

    <div class="home-footer">
      <div class="timer-pills">
        <button class="pill" data-t="30">30 秒</button>
        <button class="pill active" data-t="60">60 秒</button>
        <button class="pill" data-t="90">90 秒</button>
      </div>
      <div class="tilt-test">
        <button id="testTiltBtn" type="button" class="btn btn-ghost">測試傾斜感應</button>
        <span id="tiltStatus" class="tilt-status"></span>
      </div>
      <button id="startBtn" class="btn btn-primary" disabled>選擇一個類別開始</button>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen hidden">
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div class="topbar">
      <div class="score-box"><span>分數</span><span id="scoreVal">0</span></div>
      <div class="timer-box" id="timeVal">0:60</div>
    </div>

    <div class="zone zone-skip" id="zoneSkip">
      <div class="zone-flash" id="flashSkip"></div>
      <div class="zone-label"><span class="zone-mark">✗</span>跳過</div>
    </div>
    <div class="zone zone-correct" id="zoneCorrect">
      <div class="zone-flash" id="flashCorrect"></div>
      <div class="zone-label">答對<span class="zone-mark">✓</span></div>
    </div>

    <div class="center-divider"></div>
    <div class="word-overlay"><div class="word-card"><div class="word" id="wordVal">—</div></div></div>
    <div class="hint-pill" id="tiltHint">上下傾斜手機作答，或直接點左右兩邊</div>
  </div>

  <!-- ============ RESULTS ============ -->
  <div id="results" class="screen hidden">
    <div class="result-score">
      <div class="big" id="finalScore">0</div>
      <div class="lbl">時間到！本回合得分</div>
    </div>
    <div class="result-list" id="resultList"></div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="homeBtn">回首頁</button>
      <button class="btn btn-primary" id="replayBtn">再玩一次</button>
    </div>
  </div>

</div>

const DECKS = {};
Object.keys(RAW).forEach(k => DECKS[k] = parseWords(RAW[k]));
DECKS.mix = Array.from(new Set(Object.values(DECKS).flat()));

const CAT_META = [
  { key:'life',     label:'生活',        color:'#F4A300' },
  { key:'celeb',     label:'名人',        color:'#FF5D73' },
  { key:'brand',     label:'品牌',        color:'#4FA8E0' },
  { key:'geo',       label:'地理',        color:'#37C7C0' },
  { key:'animal',    label:'動植物',      color:'#8BC34A' },
  { key:'job',       label:'職業職場',    color:'#F2B84B' },
  { key:'movie',     label:'電影戲劇',    color:'#C98BF5' },
  { key:'onepiece',  label:'航海王',      color:'#FF8C42' },
  { key:'aot',       label:'進擊的巨人',  color:'#9AA5B1' },
  { key:'hell',      label:'什麼都知道',  color:'#FF4D6D' },
  { key:'gun',       label:'槍戰遊戲',    color:'#5B6B8C' },
  { key:'mix',       label:'混合全部',    color:'#6FCF97', mix:true },
];

/* ============================================================
   HOME SCREEN SETUP
============================================================ */
const catScroll = document.getElementById('catScroll');
CAT_META.forEach(meta=>{
  const card = document.createElement('div');
  card.className = 'cat-card' + (meta.mix ? ' mixcard' : '');
  card.style.background = meta.color;
  card.dataset.cat = meta.key;
  const words = DECKS[meta.key];
  card.innerHTML =
    '<div><div class="cat-name">' + meta.label + '</div>' +
    '<div class="cat-sample">' + words.slice(0,3).join('・') + '</div></div>' +
    '<div class="cat-count">' + words.length + ' 題</div>';
  card.addEventListener('click', ()=>{
    document.querySelectorAll('.cat-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    selectedCat = meta.key;
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = false;
    startBtn.textContent = '開始遊戲：' + meta.label;
  });
  catScroll.appendChild(card);
});

let selectedCat = null;
let roundSeconds = 60;

document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    roundSeconds = parseInt(p.dataset.t, 10);
  });
});

/* ============================================================
   SCREEN NAVIGATION
============================================================ */
const screens = {
  home: document.getElementById('home'),
  game: document.getElementById('game'),
  results: document.getElementById('results'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

/* ============================================================
   GAME STATE
============================================================ */
let queue = [];
let currentWord = null;
let score = 0;
let history = [];
let timeLeft = 60;
let totalTime = 60;
let timerInterval = null;
let tiltBaseline = null;
let tiltCooldown = false;
let orientationActive = false;

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function sizeWord(text){
  const el = document.getElementById('wordVal');
  const len = text.length;
  let size;
  if(len <= 4) size = 46;
  else if(len <= 6) size = 36;
  else if(len <= 9) size = 27;
  else size = 20;
  el.style.fontSize = 'clamp(16px, ' + size + 'px, 6vw)';
}

function nextWord(){
  if(queue.length === 0){ endRound(); return; }
  currentWord = queue.shift();
  const el = document.getElementById('wordVal');
  el.textContent = currentWord;
  sizeWord(currentWord);
}

function updateScore(){ document.getElementById('scoreVal').textContent = score; }

function flashZone(kind){
  const el = document.getElementById(kind === 'correct' ? 'flashCorrect' : 'flashSkip');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function answer(isCorrect){
  if(!currentWord) return;
  history.push({ word: currentWord, correct: isCorrect });
  if(isCorrect){ score++; updateScore(); flashZone('correct'); }
  else { queue.push(currentWord); flashZone('skip'); }
  nextWord();
}

function startTimer(){
  totalTime = roundSeconds;
  timeLeft = roundSeconds;
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){ clearInterval(timerInterval); endRound(); }
  }, 1000);
}

function updateTimerDisplay(){
  const m = Math.floor(Math.max(timeLeft,0)/60);
  const s = Math.max(timeLeft,0) % 60;
  document.getElementById('timeVal').textContent = m + ':' + String(s).padStart(2,'0');
  const pct = Math.max(timeLeft,0) / totalTime * 100;
  document.getElementById('timerFill').style.width = pct + '%';
}

function startGame(){
  if(!selectedCat) return;
  score = 0; history = [];
  queue = shuffled(DECKS[selectedCat]);
  updateScore();
  showScreen('game');
  nextWord();
  startTimer();
  setupTilt();
}

function endRound(){
  clearInterval(timerInterval);
  removeTilt();
  document.getElementById('finalScore').textContent = score;
  const list = document.getElementById('resultList');
  list.innerHTML = '';
  if(history.length === 0){
    list.innerHTML = '<div class="result-item"><span style="opacity:.6;">這回合還沒有作答紀錄</span></div>';
  } else {
    history.slice().reverse().forEach(h=>{
      const row = document.createElement('div');
      row.className = 'result-item ' + (h.correct ? 'correct' : 'skip');
      row.innerHTML = '<span class="mark">' + (h.correct ? '✓' : '✗') + '</span><span>' + h.word + '</span>';
      list.appendChild(row);
    });
  }
  showScreen('results');
}

/* interactions */
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('zoneSkip').addEventListener('click', ()=>answer(false));
document.getElementById('zoneCorrect').addEventListener('click', ()=>answer(true));
document.getElementById('replayBtn').addEventListener('click', startGame);
document.getElementById('homeBtn').addEventListener('click', ()=>{ clearInterval(timerInterval); removeTilt(); showScreen('home'); });

document.addEventListener('keydown', (e)=>{
  if(screens.game.classList.contains('hidden')) return;
  if(e.key === 'ArrowUp' || e.key === 'ArrowRight'){ answer(true); }
  else if(e.key === 'ArrowDown' || e.key === 'ArrowLeft'){ answer(false); }
});

/* ============================================================
   TILT CONTROL
   Tilt phone UP = correct (right/green). Tilt phone DOWN = skip (left/red).
============================================================ */
const TILT_THRESHOLD = 28;

function handleOrientation(e){
  if(e.beta === null || e.beta === undefined) return;
  if(tiltBaseline === null){ tiltBaseline = e.beta; return; }
  if(tiltCooldown) return;
  const delta = e.beta - tiltBaseline;
  if(delta < -TILT_THRESHOLD){ answer(true); recalibrate(); }
  else if(delta > TILT_THRESHOLD){ answer(false); recalibrate(); }
}
function recalibrate(){
  tiltCooldown = true;
  setTimeout(()=>{ tiltBaseline = null; tiltCooldown = false; }, 750);
}

function setupTilt(){
  tiltBaseline = null; tiltCooldown = false;
  const hint = document.getElementById('tiltHint');
  if(typeof DeviceOrientationEvent === 'undefined'){
    hint.textContent = '此裝置不支援傾斜偵測，請直接點左右兩邊作答';
    return;
  }
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state === 'granted'){
        window.addEventListener('deviceorientation', handleOrientation);
        orientationActive = true;
        hint.textContent = '上下傾斜手機作答，或直接點左右兩邊';
      } else {
        hint.textContent = '未取得傾斜權限，請直接點左右兩邊作答';
      }
    }).catch(()=>{ hint.textContent = '請直接點左右兩邊作答'; });
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
    orientationActive = true;
    hint.textContent = '上下傾斜手機作答，或直接點左右兩邊';
  }
}
function removeTilt(){
  if(orientationActive){ window.removeEventListener('deviceorientation', handleOrientation); orientationActive = false; }
}

/* ---------- home-screen tilt sensor test ---------- */
function testTilt(){
  const status = document.getElementById('tiltStatus');
  status.textContent = '偵測中…拿起手機轉動看看';
  let gotData = false;

  function onOrient(e){
    if(e.beta !== null && e.beta !== undefined){
      gotData = true;
      status.textContent = '✅ 感應正常，目前角度 ' + Math.round(e.beta) + '°';
    }
  }
  function finish(){
    window.removeEventListener('deviceorientation', onOrient);
    if(!gotData){
      status.textContent = '⚠️ 沒收到感應數據，請用點擊/滑動作答';
    }
  }

  if(typeof DeviceOrientationEvent === 'undefined'){
    status.textContent = '⚠️ 此瀏覽器不支援，請用點擊/滑動作答';
    return;
  }
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state === 'granted'){
        window.addEventListener('deviceorientation', onOrient);
        setTimeout(finish, 4000);
      } else {
        status.textContent = '⚠️ 未取得權限，請用點擊/滑動作答';
      }
    }).catch(()=>{
      status.textContent = '⚠️ 權限請求失敗，請用點擊/滑動作答';
    });
  } else {
    window.addEventListener('deviceorientation', onOrient);
    setTimeout(finish, 4000);
  }
}
document.getElementById('testTiltBtn').addEventListener('click', testTilt);
</script>
